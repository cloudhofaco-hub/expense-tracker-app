<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Log an expense</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --paper: #F6F3EC;
    --paper-line: #E4DFD1;
    --ink: #2B2A25;
    --ink-soft: #6F6B5C;
    --stamp: #C4482E;
    --stamp-soft: #E9DCD5;
    --ok: #4B6B4E;
    --radius: 10px;
    --mono: 'Courier New', Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .receipt {
    width: 100%;
    max-width: 420px;
  }
  .perforation {
    display: flex;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .perforation span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--paper-line);
  }
  header {
    text-align: center;
    margin-bottom: 22px;
  }
  header .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .view { display: none; }
  .view.active { display: block; }
  .total-block {
    text-align: center;
    padding: 20px 0 24px;
    border-bottom: 1px dashed var(--paper-line);
    margin-bottom: 24px;
  }
  .total-block .field-label { margin-bottom: 6px; }
  .total-amount {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 700;
  }
  .cat-row {
    margin-bottom: 14px;
  }
  .cat-row-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .cat-row-top .amt { font-family: var(--mono); color: var(--ink-soft); }
  .cat-bar-track {
    height: 8px;
    background: var(--stamp-soft);
    border-radius: 4px;
    overflow: hidden;
  }
  .cat-bar-fill {
    height: 100%;
    background: var(--stamp);
    border-radius: 4px;
  }
  .empty-note {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding: 20px 0;
  }
  .amount-block {
    text-align: center;
    padding: 20px 0 24px;
    border-bottom: 1px dashed var(--paper-line);
    margin-bottom: 24px;
  }
  .amount-block .currency {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--ink-soft);
    vertical-align: top;
    margin-right: 2px;
  }
  .amount-input {
    font-family: var(--mono);
    font-size: 46px;
    font-weight: 700;
    background: transparent;
    border: none;
    color: var(--ink);
    text-align: center;
    width: 220px;
    outline: none;
  }
  .amount-input::placeholder { color: var(--paper-line); }
  .field { margin-bottom: 22px; }
  .field-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
    display: block;
  }
  .categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .cat-btn {
    font-family: var(--sans);
    font-size: 13px;
    padding: 10px 6px;
    border-radius: var(--radius);
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .cat-btn.active {
    background: var(--stamp);
    border-color: var(--stamp);
    color: #fff;
  }
  input[type="text"], input[type="date"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  input[type="text"]:focus, input[type="date"]:focus {
    border-color: var(--stamp);
  }
  .submit-btn {
    width: 100%;
    padding: 15px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }
  .submit-btn:active { opacity: 0.8; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    margin-top: 14px;
    min-height: 16px;
    color: var(--ok);
  }
  .status.error { color: var(--stamp); }
  footer {
    text-align: center;
    margin-top: 30px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--paper-line);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="receipt">
  <div class="perforation">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>
    <div class="label">Monthly expense log</div>
    <h1 id="page-title">Add an entry</h1>
  </header>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="add">Add</button>
    <button type="button" class="tab-btn" data-tab="summary">Summary</button>
  </div>

  <div class="view active" id="view-add">
  <form id="expense-form">
    <div class="amount-block">
      <span class="currency">$</span><input class="amount-input" id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
    </div>

    <div class="field">
      <span class="field-label">Category</span>
      <div class="categories" id="categories">
        <button type="button" class="cat-btn" data-cat="Food">Food</button>
        <button type="button" class="cat-btn" data-cat="Transport">Transport</button>
        <button type="button" class="cat-btn" data-cat="Bills">Bills</button>
        <button type="button" class="cat-btn" data-cat="Shopping">Shopping</button>
        <button type="button" class="cat-btn" data-cat="Health">Health</button>
        <button type="button" class="cat-btn" data-cat="Other">Other</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Date</span>
      <input type="date" id="date" required>
    </div>

    <div class="field">
      <span class="field-label">Note (optional)</span>
      <input type="text" id="note" placeholder="e.g. lunch with team">
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">Log expense</button>
    <div class="status" id="status"></div>
  </form>
  </div>

  <div class="view" id="view-summary">
    <div class="total-block">
      <span class="field-label">This month</span>
      <div class="total-amount" id="summary-total">$0.00</div>
    </div>
    <div class="field">
      <span class="field-label">By category</span>
      <div id="summary-categories"></div>
    </div>
  </div>

  <footer>— keep every receipt —</footer>
</div>

<script>
  // Telegram Mini App setup (safe no-op if opened outside Telegram)
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const dateInput = document.getElementById('date');
  dateInput.valueAsDate = new Date();

  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbytwQbZdmNzOYcKcv6JkRfuBNAAKltXhEz2NcIR5xXchdh01ZbFZW4HbA0fYK9UsklsMQ/exec';

  // Tab switching
  const pageTitle = document.getElementById('page-title');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'summary') {
        pageTitle.textContent = 'This month';
        loadSummary();
      } else {
        pageTitle.textContent = 'Add an entry';
      }
    });
  });

  const CATEGORY_COLORS = { Food: '#C4482E', Transport: '#4B6B4E', Bills: '#6F6B5C', Shopping: '#2B2A25', Health: '#8A6D3B', Other: '#A88F7A' };

  async function loadSummary() {
    const totalEl = document.getElementById('summary-total');
    const catsEl = document.getElementById('summary-categories');
    totalEl.textContent = 'Loading...';
    catsEl.innerHTML = '';

    try {
      const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '';
      const res = await fetch(BACKEND_URL + '?userId=' + userId);
      const data = await res.json();
      const entries = data.entries || [];

      const now = new Date();
      const thisMonth = entries.filter(en => {
        const d = new Date(en.date);
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      });

      const total = thisMonth.reduce((sum, en) => sum + (en.amount || 0), 0);
      totalEl.textContent = '$' + total.toFixed(2);

      if (thisMonth.length === 0) {
        catsEl.innerHTML = '<div class="empty-note">No entries yet this month</div>';
        return;
      }

      const byCategory = {};
      thisMonth.forEach(en => {
        byCategory[en.category] = (byCategory[en.category] || 0) + en.amount;
      });

      const sorted = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
      catsEl.innerHTML = sorted.map(([cat, amt]) => {
        const pct = total > 0 ? Math.round((amt / total) * 100) : 0;
        const color = CATEGORY_COLORS[cat] || 'var(--stamp)';
        return '<div class="cat-row">' +
          '<div class="cat-row-top"><span>' + cat + '</span><span class="amt">$' + amt.toFixed(2) + '</span></div>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
          '</div>';
      }).join('');
    } catch (err) {
      totalEl.textContent = '$0.00';
      catsEl.innerHTML = '<div class="empty-note">Could not load data</div>';
    }
  }

  let selectedCategory = null;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.dataset.cat;
    });
  });

  const form = document.getElementById('expense-form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.classList.remove('error');

    const amount = parseFloat(document.getElementById('amount').value);
    if (!amount || amount <= 0) {
      statusEl.textContent = 'Enter a valid amount';
      statusEl.classList.add('error');
      return;
    }
    if (!selectedCategory) {
      statusEl.textContent = 'Pick a category';
      statusEl.classList.add('error');
      return;
    }

    const payload = {
      amount: amount,
      category: selectedCategory,
      date: document.getElementById('date').value,
      note: document.getElementById('note').value,
      // Telegram user info, available once this runs inside Telegram
      user: tg && tg.initDataUnsafe && tg.initDataUnsafe.user
        ? (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || ('id:' + tg.initDataUnsafe.user.id))
        : null,
      userId: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null,
      initData: tg ? tg.initData : ''
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging...';

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Request failed');

      statusEl.textContent = 'Saved ✓';
      form.reset();
      selectedCategory = null;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      dateInput.valueAsDate = new Date();

      if (tg) {
        tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
      }
    } catch (err) {
      statusEl.textContent = 'Could not save, try again';
      statusEl.classList.add('error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log expense';
    }
  });
</script>
</body>
</html>
